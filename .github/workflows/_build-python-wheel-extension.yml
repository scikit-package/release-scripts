name: Build wheel and sdist for an extension Python package

on:
  workflow_call:
    inputs:
      submodules:
        description: 'Submodules to check out: false, true, or recursive'
        default: 'false'
        required: false
        type: string
      project:
        description: 'Name of the project to build'
        default: 'PROJECT_NAME'
        required: true
        type: string
      latest_python_version:
        description: 'The latest supported python version'
        required: true
        type: number
      python_versions_json:
        description: 'JSON array of supported Python versions as strings'
        required: true
        type: string
      pip_packages:  # e.g. '<package1> <package2>'
        description: 'packages to install via pip'
        default: ''
        required: false
        type: string

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.latest_python_version }}

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  build-wheel:
    name: cibw-wheels-${{ matrix.buildplat }}
    runs-on: ${{ matrix.buildplat }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0

      - name: Check cibuildwheel config
        shell: bash
        run: |
          grep -q '^\[tool\.cibuildwheel' pyproject.toml || {
            echo "::error::[tool.cibuildwheel] not found in pyproject.toml"
            exit 1
          }

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          # Install in each build environment, preserving the project's hooks.
          CIBW_BEFORE_BUILD: ${{ inputs.pip_packages != '' && format('python -m pip install {0}', inputs.pip_packages) || '' }}
          CIBW_INHERIT: 'before-build: append'

      - name: Upload wheels to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.buildplat }}
          path: ./wheelhouse/*.whl

  test-wheels:
    needs: [build-wheel]
    defaults:
        run:
          shell: bash -l {0}

    name: test-wheels-${{ matrix.python }}-${{ matrix.buildplat }}
    runs-on: ${{ matrix.buildplat }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
        python: ${{ fromJSON(inputs.python_versions_json) }}

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.buildplat }}
          path: ./dist

      - name: Initialize miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: test
          channels: conda-forge
          auto-update-conda: true
          auto-activate-base: false
          python-version: ${{ matrix.python }}

      - name: Conda config
        run: >-
          conda config --set always_yes yes
          --set changeps1 no

      - name: Install requirements
        run: |
          conda install --file requirements/conda.txt
          conda install --file requirements/tests.txt
          conda install pip

      # The artifact holds one wheel per Python version; install the matching one.
      - name: Install wheel and test
        run: |
          py="${{ matrix.python }}"
          pip install ./dist/*-cp${py//./}-*.whl
          pytest
