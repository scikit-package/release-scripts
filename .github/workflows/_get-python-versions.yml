name: Get Python Versions

on:
  workflow_call:
    inputs:
      python_versions:
        description: 'Comma-separated list of Python versions. If not provided, versions will be read from pyproject.toml'
        default: ""
        required: false
        type: string
    outputs:
      python_versions:
        description: 'Comma-separated list of Python versions'
        value: ${{ jobs.get-python-versions.outputs.python_versions }}
      python_versions_json:
        description: 'JSON array of Python versions as strings'
        value: ${{ jobs.get-python-versions.outputs.python_versions_json }}

jobs:
  get-python-versions:
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.set-versions.outputs.python_versions }}
      python_versions_json: ${{ steps.format-json.outputs.python_versions_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Python for reading package metadata
        if: inputs.python_versions == ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Extract Python versions from pyproject.toml
        id: set-versions
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PYTHON_VERSIONS" ]; then
            # Use user-provided versions if specified
            VERSIONS=$(echo "$PYTHON_VERSIONS" | tr -d '[:space:]')
            if [[ -z "$VERSIONS" || "$VERSIONS" =~ (^,|,,|,$) ]]; then
              echo "Error: python_versions contains an empty version." >&2
              exit 1
            fi
            echo "Using user-provided Python versions: $VERSIONS"
          else
            VERSIONS=""
            PROJECT="{}"
            if [ -f "pyproject.toml" ]; then
              # Parse TOML rather than matching its quoting and table syntax.
              PROJECT=$(python -c 'import json, tomllib; print(json.dumps(tomllib.load(open("pyproject.toml", "rb")).get("project", {})))')
            fi

            if jq -e 'has("requires-python")' <<< "$PROJECT" > /dev/null; then
              REQUIREMENT=$(jq -r '.["requires-python"]' <<< "$PROJECT")
            else
              # Keep the classifier fallback when requires-python is absent.
              VERSIONS=$(jq -r '.classifiers[]? | capture("^Programming Language :: Python :: (?<version>[0-9]+\\.[0-9]+)$") | .version' <<< "$PROJECT" | sort -Vu | paste -sd, -)
              if [ -z "$VERSIONS" ]; then
                # Read fallback defaults from the released template.
                HEADERS=()
                if [ -n "${GH_TOKEN:-}" ]; then
                  HEADERS=(-H "Authorization: Bearer $GH_TOKEN")
                fi
                RELEASE=$(curl -fsSL --max-time 30 "${HEADERS[@]}" https://api.github.com/repos/scikit-package/scikit-package/releases/latest | jq -er '.tag_name')
                DEFAULTS=$(curl -fsSL --max-time 30 "https://raw.githubusercontent.com/scikit-package/scikit-package/$RELEASE/cookiecutter.json")
                MIN_VERSION=$(jq -r '.minimum_supported_python_version' <<< "$DEFAULTS")
                MAX_VERSION=$(jq -r '.maximum_supported_python_version | split(".") | .[1] = ((.[1] | tonumber) + 1 | tostring) | join(".")' <<< "$DEFAULTS")
                REQUIREMENT=">=$MIN_VERSION,<$MAX_VERSION"
                echo "Using scikit-package $RELEASE defaults: $REQUIREMENT"
              else
                echo "Extracted Python versions from classifiers: $VERSIONS"
              fi
            fi

            if [ -z "$VERSIONS" ]; then
              # Require exactly two minor-version bounds, in this order.
              RANGE='^[[:space:]]*>=[[:space:]]*([0-9]+\.[0-9]+)[[:space:]]*,[[:space:]]*<[[:space:]]*([0-9]+\.[0-9]+)[[:space:]]*$'
              if [[ ! "$REQUIREMENT" =~ $RANGE ]]; then
                echo "Error: requires-python must use >=major.minor, <major.minor, in that order." >&2
                exit 1
              fi
              MIN_VERSION=${BASH_REMATCH[1]}
              MAX_VERSION=${BASH_REMATCH[2]}

              # Use released versions only, even if the upper bound is in the future.
              VERSIONS=$(
                curl -fsSL --max-time 30 https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json |
                jq -r --arg min "$MIN_VERSION" --arg max "$MAX_VERSION" '
                  ($min | split(".") | map(tonumber)) as $lower |
                  ($max | split(".") | map(tonumber)) as $upper |
                  .[] | select(.stable) | .version | split(".")[:2] | map(tonumber) |
                  select(. >= $lower and . < $upper) | map(tostring) | join(".")
                ' | sort -Vu | paste -sd, -
              )
              if [ -z "$VERSIONS" ]; then
                echo "Error: requires-python selects no released Python versions: $REQUIREMENT" >&2
                exit 1
              fi
              echo "Using requires-python versions: $VERSIONS"
            fi
          fi
          echo "python_versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Format versions as JSON array
        id: format-json
        env:
          VERSIONS: ${{ steps.set-versions.outputs.python_versions }}
        run: |
          # Convert "3.9, 3.10, 3.11" to ["3.9", "3.10", "3.11"]
          JSON_ARRAY=$(echo "$VERSIONS" | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/' | sed 's/ //g')
          echo "Formatted JSON array: $JSON_ARRAY"
          echo "python_versions_json=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
