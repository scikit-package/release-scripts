name: Get Python Versions

on:
  workflow_call:
    inputs:
      python_versions:
        description: 'Comma-separated list of Python versions. If not provided, versions will be read from pyproject.toml'
        default: ""
        required: false
        type: string
    outputs:
      python_versions:
        description: 'Comma-separated list of Python versions'
        value: ${{ jobs.get-python-versions.outputs.python_versions }}
      python_versions_json:
        description: 'JSON array of Python versions as strings'
        value: ${{ jobs.get-python-versions.outputs.python_versions_json }}

jobs:
  get-python-versions:
    runs-on: ubuntu-latest
    outputs:
      python_versions: ${{ steps.set-versions.outputs.python_versions }}
      python_versions_json: ${{ steps.format-json.outputs.python_versions_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Extract Python versions from pyproject.toml
        id: set-versions
        env:
          PYTHON_VERSIONS: ${{ inputs.python_versions }}
        run: |
          if [ -n "$PYTHON_VERSIONS" ]; then
            # Use user-provided versions if specified
            VERSIONS=$(echo "$PYTHON_VERSIONS" | tr -d '[:space:]')
            if [[ -z "$VERSIONS" || "$VERSIONS" =~ (^,|,,|,$) ]]; then
              echo "Error: python_versions contains an empty version." >&2
              exit 1
            fi
            echo "Using user-provided Python versions: $VERSIONS"
          elif [ -f "pyproject.toml" ]; then
            # Read requires-python only from the project table.
            REQUIREMENT_LINE=$(awk '
              /^[[:space:]]*\[project\][[:space:]]*(#.*)?$/ { project=1; next }
              /^[[:space:]]*\[/ { project=0 }
              project && /^[[:space:]]*requires-python[[:space:]]*=/ { print; exit }
            ' pyproject.toml)
            if [ -n "$REQUIREMENT_LINE" ]; then
              REQUIREMENT=$(echo "$REQUIREMENT_LINE" | sed -nE \
                -e 's/^[^=]*=[[:space:]]*"([^"]*)"[[:space:]]*(#.*)?$/\1/p' \
                -e "s/^[^=]*=[[:space:]]*'([^']*)'[[:space:]]*(#.*)?$/\1/p")
              RANGE='^[[:space:]]*>=[[:space:]]*3\.([0-9]+)[[:space:]]*,[[:space:]]*<[[:space:]]*3\.([0-9]+)[[:space:]]*$'
              if [[ ! "$REQUIREMENT" =~ $RANGE ]]; then
                echo "Error: requires-python must use >=3.x, <3.y (minor versions only)." >&2
                exit 1
              fi
              MIN_MINOR=$((10#${BASH_REMATCH[1]}))
              MAX_MINOR=$((10#${BASH_REMATCH[2]}))
              if [ "$MIN_MINOR" -ge "$MAX_MINOR" ]; then
                echo "Error: requires-python selects no Python versions." >&2
                exit 1
              fi
              VERSIONS=$(seq "$MIN_MINOR" "$((MAX_MINOR - 1))" | sed 's/^/3./' | tr '\n' ',' | sed 's/,$//')
              echo "Using requires-python versions: $VERSIONS"
            else
              # Keep the existing classifier fallback when requires-python is absent.
              VERSIONS=$(
                (grep -oE 'Programming Language :: Python :: 3\.[0-9]+' pyproject.toml || true) |
                sed -E 's/.*Python :: (3\.[0-9]+).*/\1/' | sort -Vu | tr '\n' ',' | sed 's/,$//'
              )
              if [ -z "$VERSIONS" ]; then
                echo "Warning: No Python version classifiers found in pyproject.toml"
                VERSIONS="3.12,3.13,3.14"
                echo "Using fallback versions: $VERSIONS"
              else
                echo "Extracted Python versions from pyproject.toml: $VERSIONS"
              fi
            fi
          else
            echo "Warning: pyproject.toml not found"
            VERSIONS="3.12,3.13,3.14"
            echo "Using fallback versions: $VERSIONS"
          fi
          echo "python_versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Format versions as JSON array
        id: format-json
        env:
          VERSIONS: ${{ steps.set-versions.outputs.python_versions }}
        run: |
          # Convert "3.9, 3.10, 3.11" to ["3.9", "3.10", "3.11"]
          JSON_ARRAY=$(echo "$VERSIONS" | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/' | sed 's/ //g')
          echo "Formatted JSON array: $JSON_ARRAY"
          echo "python_versions_json=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
