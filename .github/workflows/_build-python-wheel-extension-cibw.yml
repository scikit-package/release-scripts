name: Build wheel and sdist for an extension Python package with cibuildwheel

on:
  workflow_call:
    inputs:
      submodules:
        description: 'Submodules to check out: false, true, or recursive'
        default: 'false'
        required: false
        type: string
      latest_python_version:
        description: 'The latest supported python version'
        required: true
        type: number
      python_versions_json:
        description: 'JSON array of supported Python versions as strings'
        required: true
        type: string

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.latest_python_version }}

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: ./dist/*.tar.gz

  build-wheel:
    needs: [build_sdist]
    name: cibw-wheels-${{ matrix.buildplat }}
    runs-on: ${{ matrix.buildplat }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0

      - name: Check cibuildwheel config
        shell: bash
        run: |
          grep -q '^\[tool\.cibuildwheel' pyproject.toml || {
            echo "::error::[tool.cibuildwheel] table not found in pyproject.toml. Please add it to configure cibuildwheel, or set build_c_ext_with_cibw to false."
            exit 1
          }

      # Build for the Python versions in the classifiers, e.g. "3.12,3.13" -> "cp312-* cp313-*".
      - name: Select Python versions
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ join(fromJSON(inputs.python_versions_json), ' ') }}
        run: |
          build=""
          for v in $PYTHON_VERSIONS; do
            build+="cp${v//./}-* "
          done
          echo "CIBW_BUILD=${build% }" >> "$GITHUB_ENV"
          echo "CIBW_BUILD=${build% }"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4

      - name: Upload wheels to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.buildplat }}
          path: ./wheelhouse/*.whl
